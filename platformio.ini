[platformio]
default_envs = moonlight_s3
core_dir = C:/pio-sm-s3

[env:moonlight_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = moonlight-s3-n16r8
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_upload.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_unflags = -Os -Wl,--wrap=log_printf
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
  -Ilib/esp_new_jpeg/include
  -Llib/esp_new_jpeg/lib/esp32s3
  -lesp_new_jpeg
lib_ldf_mode = deep+
